name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  PREMAKE_VERSION: 5.0.0-beta8

jobs:
  linux:
    name: Linux (GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compilers and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libcurl4-openssl-dev clang-18 lld-18 llvm-18 \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb

      - name: Install premake
        run: |
          set -e
          url="https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz"
          if curl -fsSL "$url" -o premake.tar.gz && tar -xzf premake.tar.gz premake5; then
            sudo install premake5 /usr/local/bin/premake5
          else
            echo "release download failed; building premake from source"
            git clone --depth 1 --branch "v${PREMAKE_VERSION}" https://github.com/premake/premake-core /tmp/premake
            make -C /tmp/premake -f Bootstrap.mak linux -j"$(nproc)"
            sudo install /tmp/premake/bin/release/premake5 /usr/local/bin/premake5
          fi
          premake5 --version

      - name: Build
        run: |
          premake5 gmake
          make -C build config=release_x64 CC=gcc-14 CXX=g++-14 -j"$(nproc)"

      - name: Unit and integration tests
        run: ./bin/Release/decomp_tests

      - name: GUI tests (headless)
        run: ./bin/Release/decomp_gui_tests

      - name: GUI smoke test (Xvfb)
        run: xvfb-run -a ./bin/Release/decomp-gui --frames 60 --screenshot gui-shell.png --config-dir "$(mktemp -d)"

      - name: GUI end to end (Xvfb)
        run: |
          # The real app opens a project, runs every function with scripted responses and exits when done.
          p="$(mktemp -d)/project"
          ./bin/Release/decomp init tests/fixtures/x86/basic.exe --dir "$p" --toolchain clang-cl-x86 \
            --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c-
          xvfb-run -a ./bin/Release/decomp-gui --config-dir "$(mktemp -d)" --project "$p" --replay-dir tests/replay/run \
            --run-all --exit-when-done --screenshot gui-run.png
          ./bin/Release/decomp -C "$p" runs list
          ./bin/Release/decomp -C "$p" --json runs list | python3 -c "import json,sys; r=json.load(sys.stdin); assert r[0]['status'] == 'completed' and r[0]['matched'] == 8, r"

      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: |
            gui-shell.png
            gui-run.png

      - name: CLI smoke test
        run: |
          ./bin/Release/decomp info tests/fixtures/x86/basic.exe
          ./bin/Release/decomp diff --binary tests/fixtures/x86/basic.exe --obj tests/fixtures/x86/basic.obj --all
          ./bin/Release/decomp diff --binary tests/fixtures/x64/basic.exe --obj tests/fixtures/x64/basic.obj --all
          # The agent end to end without an API key: a scripted replay matches add() with clang-cl.
          p="$(mktemp -d)/project"
          ./bin/Release/decomp init tests/fixtures/x86/basic.exe --dir "$p" --toolchain clang-cl-x86 \
            --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c-
          ./bin/Release/decomp -C "$p" agent add --replay tests/replay/agent_match_add.jsonl
          ./bin/Release/decomp -C "$p" status
          test -f "$p/src/functions/add_401060.cpp"
          test -f "$(ls -d "$p"/.decomp/runs/*/ | head -1)summary.json"
          # A one-function run like any other: listed, with its run.json.
          test -f "$(ls -d "$p"/.decomp/runs/*/ | head -1)run.json"
          ./bin/Release/decomp -C "$p" runs list | grep completed

      - name: Batch run smoke test
        run: |
          # Every function of the x86 fixture on 4 workers with scripted responses: 8 match, the rest give up.
          p="$(mktemp -d)/project"
          ./bin/Release/decomp init tests/fixtures/x86/basic.exe --dir "$p" --toolchain clang-cl-x86 \
            --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c-
          ./bin/Release/decomp -C "$p" run --all --workers 4 --replay-dir tests/replay/run
          ./bin/Release/decomp -C "$p" runs list
          run_id="$(ls "$p/.decomp/runs" | head -1)"
          ./bin/Release/decomp -C "$p" --json runs show "$run_id" > shown.json
          python3 tests/integration/check_run_summary.py shown.json "$p/.decomp/runs/$run_id/summary.json" 8
          test "$(ls "$p"/src/functions/*.cpp | wc -l)" -eq 8

      - name: Function bounds corpus (clang-cl)
        run: |
          # Zydis built without a C library; functions found without the PDB against the PDB and the map.
          tests/corpus/build_corpus.sh build/corpus
          for arch in x86 x64; do
            ./bin/Release/decomp bounds build/corpus/$arch/corpus.exe --truth build/corpus/$arch/corpus.pdb --min-exact 98
            ./bin/Release/decomp bounds build/corpus/$arch/corpus.exe --truth build/corpus/$arch/corpus.map --min-exact 98
          done

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install premake
        shell: pwsh
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v$env:PREMAKE_VERSION/premake-$env:PREMAKE_VERSION-windows.zip"
          New-Item -ItemType Directory -Force tools | Out-Null
          try {
            Invoke-WebRequest $url -OutFile premake.zip
            Expand-Archive premake.zip -DestinationPath tools -Force
          } catch {
            Write-Host "release download failed; building premake from source"
            git clone --depth 1 --branch "v$env:PREMAKE_VERSION" https://github.com/premake/premake-core premake-src
            Push-Location premake-src
            cmd /c Bootstrap.bat
            Pop-Location
            Copy-Item premake-src\bin\release\premake5.exe tools\
          }
          & tools\premake5.exe --version

      - name: Pick the Visual Studio action
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $major = [int](& $vswhere -latest -property catalog_productLineVersion)
          $action = if ($major -ge 2026) { "vs2026" } else { "vs2022" }
          Write-Host "Visual Studio $major -> premake action $action"
          "action=$action" >> $env:GITHUB_OUTPUT

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          tools\premake5.exe ${{ steps.vs.outputs.action }}
          msbuild build\Decomp.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Unit and integration tests
        run: bin\Release\decomp_tests.exe

      # decomp-gui itself is built but not run: hosted runners have no OpenGL 3.
      - name: GUI tests (headless)
        run: bin\Release\decomp_gui_tests.exe

      - name: MSVC round trip (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - shell: pwsh
        run: tests\integration\msvc_roundtrip.ps1 -Arch x86
      - name: Function bounds corpus (MSVC x86)
        shell: pwsh
        run: tests\corpus\build_corpus.ps1 -Arch x86 -MinExact 98

      - name: MSVC round trip (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - shell: pwsh
        run: tests\integration\msvc_roundtrip.ps1 -Arch x64
      - name: Function bounds corpus (MSVC x64)
        shell: pwsh
        run: tests\corpus\build_corpus.ps1 -Arch x64 -MinExact 98

      # The cl.exe-built corpus, to look into what the analysis gets wrong on it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msvc-corpus
          path: |
            build/corpus-msvc-x86/corpus.*
            build/corpus-msvc-x64/corpus.*
          if-no-files-found: ignore
