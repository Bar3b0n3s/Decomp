name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  PREMAKE_VERSION: 5.0.0-beta8

jobs:
  linux:
    name: Linux (GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compilers and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libcurl4-openssl-dev clang-18 lld-18 llvm-18 \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb

      - name: Install premake
        run: |
          set -e
          url="https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz"
          if curl -fsSL "$url" -o premake.tar.gz && tar -xzf premake.tar.gz premake5; then
            sudo install premake5 /usr/local/bin/premake5
          else
            echo "release download failed; building premake from source"
            git clone --depth 1 --branch "v${PREMAKE_VERSION}" https://github.com/premake/premake-core /tmp/premake
            make -C /tmp/premake -f Bootstrap.mak linux -j"$(nproc)"
            sudo install /tmp/premake/bin/release/premake5 /usr/local/bin/premake5
          fi
          premake5 --version

      - name: Build
        run: |
          premake5 gmake
          make -C build config=release_x64 CC=gcc-14 CXX=g++-14 -j"$(nproc)"

      - name: Unit and integration tests
        run: ./bin/Release/decomp_tests

      - name: GUI tests (headless)
        run: ./bin/Release/decomp_gui_tests

      - name: GUI smoke test (Xvfb)
        run: xvfb-run -a ./bin/Release/decomp-gui --frames 60 --screenshot gui-shell.png --config-dir "$(mktemp -d)"

      - name: GUI end to end (Xvfb)
        run: |
          # The real app opens a project, runs every function with scripted responses and exits when done.
          p="$(mktemp -d)/project"
          ./bin/Release/decomp init tests/fixtures/x86/basic.exe --dir "$p" --toolchain clang-cl-x86 \
            --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c-
          xvfb-run -a ./bin/Release/decomp-gui --config-dir "$(mktemp -d)" --project "$p" --replay-dir tests/replay/run \
            --run-all --exit-when-done --screenshot gui-run.png
          ./bin/Release/decomp -C "$p" runs list
          ./bin/Release/decomp -C "$p" --json runs list | python3 -c "import json,sys; r=json.load(sys.stdin); assert r[0]['status'] == 'completed' and r[0]['matched'] == 8, r"

      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: |
            gui-shell.png
            gui-run.png

      - name: CLI smoke test
        run: |
          ./bin/Release/decomp info tests/fixtures/x86/basic.exe
          ./bin/Release/decomp diff --binary tests/fixtures/x86/basic.exe --obj tests/fixtures/x86/basic.obj --all
          ./bin/Release/decomp diff --binary tests/fixtures/x64/basic.exe --obj tests/fixtures/x64/basic.obj --all
          # The agent end to end without an API key: a scripted replay matches add() with clang-cl.
          p="$(mktemp -d)/project"
          ./bin/Release/decomp init tests/fixtures/x86/basic.exe --dir "$p" --toolchain clang-cl-x86 \
            --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c-
          ./bin/Release/decomp -C "$p" agent add --replay tests/replay/agent_match_add.jsonl
          ./bin/Release/decomp -C "$p" status
          # The fixture's PDB gives add its unit: the match is in the unit's source, which verifies.
          grep -qx "// FUNCTION: 0x00401060" "$p/src/basic.cpp"
          ./bin/Release/decomp -C "$p" units verify
          test -f "$(ls -d "$p"/.decomp/runs/*/ | head -1)summary.json"
          # A one-function run like any other: listed, with its run.json.
          test -f "$(ls -d "$p"/.decomp/runs/*/ | head -1)run.json"
          ./bin/Release/decomp -C "$p" runs list | grep completed

      - name: Types smoke test
        run: |
          # The fixtures' types, declared in project headers, compile (clang-cl /Z7) to the layouts in their PDBs.
          for arch in x86 x64; do
            for name in basic rtti; do
              p="$(mktemp -d)/project"
              ./bin/Release/decomp init tests/fixtures/$arch/$name.exe --dir "$p" --toolchain clang-cl-$arch
              cp tests/fixtures/include/$name.h "$p/include/"
              ./bin/Release/decomp -C "$p" types check
              # Declared from the PDB instead, they compile to the same layouts.
              q="$(mktemp -d)/project"
              ./bin/Release/decomp init tests/fixtures/$arch/$name.exe --dir "$q" --toolchain clang-cl-$arch
              ./bin/Release/decomp -C "$q" types import --all
              ./bin/Release/decomp -C "$q" types check
            done
          done
          ./bin/Release/decomp -C "$p" types show Unit
          # Without the PDB, class skeletons from the RTTI compile to the vtables and base offsets it says.
          for arch in x86 x64; do
            d="$(mktemp -d)"
            mkdir "$d/bin"
            cp tests/fixtures/$arch/rtti.exe "$d/bin/"
            ./bin/Release/decomp init "$d/bin/rtti.exe" --dir "$d/project" --toolchain clang-cl-$arch
            ./bin/Release/decomp -C "$d/project" types skeletons
          done

      - name: Batch run smoke test
        run: |
          # Every function of the x86 fixture on 4 workers with scripted responses: 8 match, the rest give up.
          p="$(mktemp -d)/project"
          ./bin/Release/decomp init tests/fixtures/x86/basic.exe --dir "$p" --toolchain clang-cl-x86 \
            --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c-
          ./bin/Release/decomp -C "$p" run --all --workers 4 --replay-dir tests/replay/run
          ./bin/Release/decomp -C "$p" runs list
          run_id="$(ls "$p/.decomp/runs" | head -1)"
          ./bin/Release/decomp -C "$p" --json runs show "$run_id" > shown.json
          python3 tests/integration/check_run_summary.py shown.json "$p/.decomp/runs/$run_id/summary.json" 8
          # The workers composed the 8 matches into the units' sources; every function there verifies.
          test "$(cat "$p"/src/*.cpp | grep -c '^// FUNCTION: ')" -eq 8
          ./bin/Release/decomp -C "$p" units verify
          # Progress and spend per unit: 7 of basic.obj's functions and other.obj's one.
          ./bin/Release/decomp -C "$p" status
          ./bin/Release/decomp -C "$p" --json status | python3 -c "import json,sys; u={x['name']: x for x in json.load(sys.stdin)['units']}; assert u['basic.obj']['matched_functions'] == 7 and u['other.obj']['matched_functions'] == 1 and u['basic.obj']['cost_usd'] > 0, u"
          # The whole program linked again by lld-link: other.obj, complete after the run, from its source,
          # basic.obj from its original bytes. Identical to the target once its build timestamps and PDB GUID
          # are taken over.
          ./bin/Release/decomp -C "$p" units check || true
          ./bin/Release/decomp -C "$p" relink
          ./bin/Release/decomp -C "$p" --json relink | python3 -c "import json,sys; r=json.load(sys.stdin); u={x['unit']: x['mode'] for x in r['units']}; assert r['identical'] and u['other.obj'] == 'source' and u['basic.obj'] == 'split', u"

      - name: Relink smoke test
        run: |
          # The fixtures rebuilt from their units' sources, composed from the fixture's own translation units,
          # and linked again by lld-link are identical to the originals (and so are they from split objects).
          for arch in x86 x64; do
            p="$(mktemp -d)/project"
            ./bin/Release/decomp init tests/fixtures/$arch/basic.exe --dir "$p" --toolchain clang-cl-$arch \
              --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c-
            ./bin/Release/decomp -C "$p" relink --all-split
            ./bin/Release/decomp -C "$p" units compose basic.obj tests/fixtures/src/basic.cpp
            ./bin/Release/decomp -C "$p" units compose other.obj tests/fixtures/src/other.cpp
            ./bin/Release/decomp -C "$p" units check
            ./bin/Release/decomp -C "$p" relink
            ./bin/Release/decomp -C "$p" --json relink | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['identical'] and all(u['mode'] != 'split' for u in r['units']), r['units']"
          done

      - name: Function bounds corpus (clang-cl)
        run: |
          # Zydis built without a C library; functions (and units) found without the PDB against the PDB and the map.
          tests/corpus/build_corpus.sh build/corpus
          for arch in x86 x64; do
            ./bin/Release/decomp bounds build/corpus/$arch/corpus.exe --truth build/corpus/$arch/corpus.pdb --min-exact 98 --units
            ./bin/Release/decomp bounds build/corpus/$arch/corpus.exe --truth build/corpus/$arch/corpus.map --min-exact 98 --units
          done

      - name: Corpus relink (clang-cl)
        run: |
          # The corpus is a real program of 31 units. Relinked by lld-link from split objects alone, and with nine
          # of its units (Zydis's decoder among them, and the SEH unit) built from their own sources composed
          # into unit sources, the rest split: byte-identical both times.
          z="$PWD/external/zydis"
          for arch in x86 x64; do
            p="$(mktemp -d)/corpus"
            ./bin/Release/decomp init build/corpus/$arch/corpus.exe --dir "$p" --toolchain clang-cl-$arch \
              --flag /O2 --flag /Gy --flag /GS- --flag /GR- --flag /EHs-c- \
              --flag -DZYAN_NO_LIBC --flag -DZYDIS_STATIC_BUILD --flag -DZYCORE_STATIC_BUILD \
              --flag "-I$z/include" --flag "-I$z/src" --flag "-I$z/dependencies/zycore/include"
            ./bin/Release/decomp -C "$p" relink --all-split
            ./bin/Release/decomp -C "$p" --json units > "$p/units.json"
            for pair in src/Decoder.c:$z/src/Decoder.c src/Mnemonic.c:$z/src/Mnemonic.c src/Register.c:$z/src/Register.c \
                        src/Utils.c:$z/src/Utils.c src/FormatterBuffer.c:$z/src/FormatterBuffer.c \
                        src/zycore/src/String.c:$z/dependencies/zycore/src/String.c \
                        src/seh.c:tests/corpus/seh.c src/rt.c:tests/corpus/rt.c src/main.c:tests/corpus/main.c; do
              unit=$(python3 -c "import json,sys; print(next(u['name'] for u in json.load(open(sys.argv[1])) if u['source'] == sys.argv[2]))" "$p/units.json" "${pair%%:*}")
              ./bin/Release/decomp -C "$p" units compose "$unit" "${pair#*:}"
            done
            ./bin/Release/decomp -C "$p" --json relink | python3 -c "import json,sys; r=json.load(sys.stdin); n=sum(u['mode'] == 'source' for u in r['units']); assert r['identical'] and n == 9, (n, r.get('comparison', {}).get('first'))"
          done

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install premake
        shell: pwsh
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v$env:PREMAKE_VERSION/premake-$env:PREMAKE_VERSION-windows.zip"
          New-Item -ItemType Directory -Force tools | Out-Null
          try {
            Invoke-WebRequest $url -OutFile premake.zip
            Expand-Archive premake.zip -DestinationPath tools -Force
          } catch {
            Write-Host "release download failed; building premake from source"
            git clone --depth 1 --branch "v$env:PREMAKE_VERSION" https://github.com/premake/premake-core premake-src
            Push-Location premake-src
            cmd /c Bootstrap.bat
            Pop-Location
            Copy-Item premake-src\bin\release\premake5.exe tools\
          }
          & tools\premake5.exe --version

      - name: Pick the Visual Studio action
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $major = [int](& $vswhere -latest -property catalog_productLineVersion)
          $action = if ($major -ge 2026) { "vs2026" } else { "vs2022" }
          Write-Host "Visual Studio $major -> premake action $action"
          "action=$action" >> $env:GITHUB_OUTPUT

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          tools\premake5.exe ${{ steps.vs.outputs.action }}
          msbuild build\Decomp.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Unit and integration tests
        run: bin\Release\decomp_tests.exe

      # decomp-gui itself is built but not run: hosted runners have no OpenGL 3.
      - name: GUI tests (headless)
        run: bin\Release\decomp_gui_tests.exe

      - name: MSVC round trip (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - shell: pwsh
        run: tests\integration\msvc_roundtrip.ps1 -Arch x86
      - name: Function bounds corpus (MSVC x86)
        shell: pwsh
        run: tests\corpus\build_corpus.ps1 -Arch x86 -MinExact 98

      - name: MSVC round trip (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - shell: pwsh
        run: tests\integration\msvc_roundtrip.ps1 -Arch x64
      - name: Function bounds corpus (MSVC x64)
        shell: pwsh
        run: tests\corpus\build_corpus.ps1 -Arch x64 -MinExact 98

      # The cl.exe-built corpus and round trip with their relinks, to look into what the analysis or the
      # relink gets wrong on them.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msvc-builds
          path: |
            build/corpus-msvc-x86/corpus.*
            build/corpus-msvc-x64/corpus.*
            build/corpus-msvc-x86/obj/*.obj
            build/corpus-msvc-x64/obj/*.obj
            build/corpus-msvc-x86/project/.decomp/relink/out/corpus.exe
            build/corpus-msvc-x64/project/.decomp/relink/out/corpus.exe
            build/corpus-msvc-x86/project/.decomp/relink/result.json
            build/corpus-msvc-x64/project/.decomp/relink/result.json
            build/corpus-msvc-x86/project/.decomp/relink/objects/*.obj
            build/corpus-msvc-x64/project/.decomp/relink/objects/*.obj
            build/msvc-roundtrip-x86/basic.*
            build/msvc-roundtrip-x64/basic.*
            build/msvc-roundtrip-x86/other.obj
            build/msvc-roundtrip-x64/other.obj
            build/msvc-roundtrip-x86/project/.decomp/relink/out/basic.exe
            build/msvc-roundtrip-x64/project/.decomp/relink/out/basic.exe
            build/msvc-roundtrip-x86/project/.decomp/relink/objects/*.obj
            build/msvc-roundtrip-x64/project/.decomp/relink/objects/*.obj
            build/msvc-roundtrip-x86/project/.decomp/relink/result.json
            build/msvc-roundtrip-x64/project/.decomp/relink/result.json
          if-no-files-found: ignore
          include-hidden-files: true
